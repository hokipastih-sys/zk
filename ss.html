<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator JS - Fixed</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            font-family: sans-serif;
        }

        .calculator {
            background-color: #333;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.3);
        }

        #input-box {
            width: 100%;
            height: 80px;
            font-size: 32px;
            text-align: right;
            margin-bottom: 15px;
            border: none;
            background-color: #fff;
            border-radius: 10px;
            padding: 10px;
            box-sizing: border-box;
        }

        /* Container untuk tombol agar tersusun rapi */
        .button-row {
            display: flex;
            justify-content: center;
        }

        button {
            width: 60px;
            height: 60px;
            margin: 5px;
            border: none;
            border-radius: 50%; /* Membuat tombol bulat */
            font-size: 20px;
            cursor: pointer;
            background-color: #e0e0e0;
            transition: 0.2s;
        }

        button:hover {
            background-color: #d4d4d4;
        }

        .operator {
            background-color: #ff9f43;
            color: white;
        }

        .equal-btn {
            background-color: #2ecc71;
            color: white;
            width: 130px;
            border-radius: 30px; /* Lonjong untuk tombol sama dengan */
        }
    </style>
</head>
<body>

    <div class="calculator">
        <input type="text" id="input-box" placeholder="0" readonly>
        
        <div class="button-row">
            <button class="operator" onclick="clearScreen()">AC</button>
            <button class="operator" onclick="deleteChar()">Del</button>
            <button class="operator" onclick="display('%')">%</button>
            <button class="operator" onclick="display('/')">/</button>
        </div>
        <div class="button-row">
            <button onclick="display('7')">7</button>
            <button onclick="display('8')">8</button>
            <button onclick="display('9')">9</button>
            <button class="operator" onclick="display('*')">x</button>
        </div>
        <div class="button-row">
            <button onclick="display('4')">4</button>
            <button onclick="display('5')">5</button>
            <button onclick="display('6')">6</button>
            <button class="operator" onclick="display('-')">-</button>
        </div>
        <div class="button-row">
            <button onclick="display('1')">1</button>
            <button onclick="display('2')">2</button>
            <button onclick="display('3')">3</button>
            <button class="operator" onclick="display('+')">+</button>
        </div>
        <div class="button-row">
            <button onclick="display('0')">0</button>
            <button onclick="display('.')">.</button>
            <button class="equal-btn" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
                const screen = document.getElementById('input-box');

        function display(value) {
            screen.value += value;
        }

        function clearScreen() {
            screen.value = '';
        }

        function deleteChar() {
            screen.value = screen.value.slice(0, -1);
        }

        function calculate() {
            try {
                
                screen.value = eval(screen.value);
            } catch (error) {
                screen.value = "Error";
            }
        }
    </script>
</body>
</html>
