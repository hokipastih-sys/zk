<title>membuat rasengan</title>
<body>
  <div id="instruction"></div>
  <video id="input_video"  ></video>
  <canvas id="output_canvas"
 width="950" height="800"></canvas>
</body>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <style>
    body{
      margin: 0;
      display:flex ;
      justify-content:center ;
      align-items: center;
      background-color: black;
      color: white;
      overflow: hidden;
    }
    canvas{
      border: 4px solid #30E2F5;
      border-radius: 15px;
    transform: scaleX(-1); 
    }
    video { display: none;}
    #instruction{
      position: absolute;
      top: 20px;
      text-align: center;
      width: 100%;
      pointer-events: none;
    }
</style>
  <script type="module">
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    
    // Variabel untuk animasi Rasengan
    let rasenganRotation = 0;

    // Fungsi untuk menggambar efek Rasengan yang berputar
    function drawRasengan(ctx, x, y, radius) {
      if (radius < 5) return; // Jangan gambar jika terlalu kecil

      ctx.save();
      // Pindahkan koordinat pusat ke posisi tangan
      ctx.translate(x, y);
      
      // Animasi perputaran
      rasenganRotation += 0.15; // Kecepatan putaran
      ctx.rotate(rasenganRotation);

      // --- Lapis 1: Cahaya Luar (Outer Glow) ---
      ctx.shadowBlur = radius * 1.5;
      ctx.shadowColor = 'rgba(0, 200, 255, 0.8)';
      ctx.fillStyle = 'rgba(100, 230, 255, 0.1)';
      ctx.beginPath();
      ctx.arc(0, 0, radius * 1.2, 0, Math.PI * 2);
      ctx.fill();

      // --- Lapis 2: Inti Bergejolak (Swirling Core) ---
      // Kita buat gradien kompleks yang berputar
      ctx.shadowBlur = radius * 0.5;
      ctx.shadowColor = 'red';
      
      const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, radius);
      gradient.addColorStop(0, 'rgba(255, 255, 255, 1)'); // Putih di tengah
      gradient.addColorStop(0.3, 'rgba(233, 152, 5, 1)'); 
      gradient.addColorStop(0.6, 'rgba(24, 130, 255, 1)'); // Biru energi
      gradient.addColorStop(1, 'rgba(14, 239, 255, 1)'); // Transparan di pinggir

      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.fill();

      // --- Lapis 3: Garis-garis Energi (Energy Streaks) ---
      // Menggambar beberapa elips yang berputar berbeda untuk efek gejolak
      ctx.strokeStyle = 'rgba(0, 0, 0, 1)';
      ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        // Elips yang sedikit acak ukurannya
        ctx.ellipse(0, 0, radius * (0.8 + Math.sin(rasenganRotation + i) * 0.1), 
                    radius * (0.4 + Math.cos(rasenganRotation * 0.5 + i) * 0.1), 
                    (Math.PI / 3) * i + rasenganRotation * (i+1) * 0.5, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.restore();
    }

    function onResults(results) {
      // Bersihkan canvas
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      
      // Gambar feed video di belakang
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.multiHandLandmarks) {
        for (const landmarks of results.multiHandLandmarks) {
          // --- Menghitung Titik Pusat Telapak Tangan ---
          // Kita gunakan rata-rata dari Wrist (0), Index Finger MCP (5), dan Pinky MCP (17)
          // Ini adalah estimasi terbaik untuk tengah telapak tangan
          const wrist = landmarks[0];
          const indexBase = landmarks[5];
          const pinkyBase = landmarks[17];
          
          // Koordinat dalam pixel
          const centerX = ((wrist.x + indexBase.x + pinkyBase.x) / 3) * canvasElement.width;
          const centerY = ((wrist.y + indexBase.y + pinkyBase.y) / 3) * canvasElement.height;

          // --- Menghitung Ukuran Rasengan ---
          // Ukuran didasarkan pada jarak antara Wrist (0) dan Middle Finger Tip (12)
          const middleTip = landmarks[12];
          const handSize = Math.sqrt(
            Math.pow((middleTip.x - wrist.x) * canvasElement.width, 2) + 
            Math.pow((middleTip.y - wrist.y) * canvasElement.height, 2)
          );
          
          // Radius Rasengan adalah sekitar setengah dari ukuran tangan
          const rasenganRadius = handSize * 0.6;

          // --- Menggambar Rasengan ---
          drawRasengan(canvasCtx, centerX, centerY, rasenganRadius);

          // (Opsional) Menggambar rangka tangan agar tahu deteksi bekerja
          // drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: 'rgba(0, 255, 0, 0.3)', lineWidth: 1});
          // drawLandmarks(canvasCtx, landmarks, {color: 'rgba(255, 0, 0, 0.3)', lineWidth: 0.5, radius: 2});
        }
      }
      canvasCtx.restore();
    }

    // Inisialisasi Mediapipe Hands
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1, // 1 untuk performa seimbang, 0 untuk paling cepat
      minDetectionConfidence: 0.7, // Ditingkatkan agar efek tidak 'loncat-loncat'
      minTrackingConfidence: 0.7
    });

    hands.onResults(onResults);

    // Memulai Kamera
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({image: videoElement});
      },
      width: 800,
      height: 600
    });
    camera.start();
  </script>
